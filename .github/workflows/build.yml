name: Build QMK firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable git safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK firmware (vendor fork)
        uses: actions/checkout@v4
        with:
          # 这份固件依赖厂商 fork 的 eeconfig / 无线模块接口，不能直接用官方 qmk/qmk_firmware
          repository: yangzheng20003/qmk_firmware
          ref: master
          submodules: recursive

      - name: Install QMK Python requirements
        run: |
          # 该 fork 的 requirements 与容器自带的不同（如 appdirs），需按提示安装
          PY=/opt/uv/tools/qmk/bin/python3
          if [ ! -x "$PY" ]; then PY=$(command -v python3); fi
          "$PY" -m pip install -r requirements.txt

      - name: Checkout this keyboard repo
        uses: actions/checkout@v4
        with:
          path: _keyboard

      - name: Overlay keyboard into QMK tree
        run: |
          cp -r _keyboard/keyboards/. keyboards/
          find keyboards/linker keyboards/royalkludge -maxdepth 3 | sort

      - name: Build firmware
        run: make royalkludge/rk98pro_us_triple_mode:default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk98pro-firmware
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RK98PRO 三模 QMK 固件 ${{ github.ref_name }}
          body_path: _keyboard/RELEASE_NOTES.md
          files: |
            *.bin
            _keyboard/keyboards/royalkludge/rk98pro_us_triple_mode/rk98pro_us_triple_mode.json
          fail_on_unmatched_files: true
